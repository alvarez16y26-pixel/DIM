<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Regístrate - Wiki-Cule</title>
	<link rel="stylesheet" href="style.css?v=1.0">
</head>
<body class="registro-page">
	<main class="registro-container">
		<section class="registro-window" aria-labelledby="registro-titulo">
			<header class="registro-header">
				<h1 id="registro-titulo" class="gradient-title">Regístrate en Wiki-Cule</h1>
				<p>Completa tus datos para formar parte de nuestra comunidad culé.</p>
			</header>

			<form class="registro-form" id="registro-form" action="#" method="post">
			<div class="registro-fields">
				<div class="registro-field">
					<label for="nombre">Nombre</label>
					<input type="text" id="nombre" name="nombre" autocomplete="given-name" required>
				</div>

				<div class="registro-field">
					<label for="apellido">Apellido</label>
					<input type="text" id="apellido" name="apellido" autocomplete="family-name" required>
				</div>

				<div class="registro-field">
					<label for="gmail">Gmail</label>
					<input type="email" id="gmail" name="gmail" placeholder="ejemplo@gmail.com" pattern="[a-zA-Z0-9._%+-]+@gmail\.com" autocomplete="email" required>
				</div>

				<div class="registro-field">
					<label for="numero">Número de teléfono</label>
					<input type="tel" id="numero" name="numero" inputmode="tel" autocomplete="tel" required>
				</div>

				<div class="registro-field">
					<label for="fecha-nacimiento">Fecha de nacimiento</label>
					<input type="date" id="fecha-nacimiento" name="fecha_nacimiento" autocomplete="bday" required>
				</div>

				<div class="registro-field">
					<label for="edad">Edad</label>
					<input type="number" id="edad" name="edad" min="1" max="120" inputmode="numeric" required>
				</div>
			</div>

			<button class="registro-submit" type="submit">Crear registro</button>
			</form>

			<div class="boton-centro">
				<a class="btn btn-siguiente" href="index.html">Volver</a>
			</div>
		</section>
	</main>
	<script>
		document.getElementById('registro-form').addEventListener('submit', function (event) {
			event.preventDefault();
			const nombre = document.getElementById('nombre').value.trim();
			localStorage.setItem('wikiCuleNombre', nombre);
			window.location.href = 'index.html';
		});
	</script>
</body>
</html>
